name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma Client Generate
        run: npm run prisma:generate

      - name: Check code formatting / diff
        run: git diff --check HEAD^ HEAD

      - name: Check for debug console.log in source
        run: |
          if grep -rn 'console\.log' src/; then
            echo "ERROR: console.log found in src/ — remove before merging"
            exit 1
          fi

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://supportpilot:supportpilot@localhost:5432/supportpilot?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-github-actions-jwt-access-secret-min-32-chars
          JWT_REFRESH_SECRET: test-github-actions-jwt-refresh-secret-min-32-chars

      - name: Create isolated tenant integration database
        run: psql -h 127.0.0.1 -U supportpilot -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE supportpilot_tenant_test'
        env:
          PGPASSWORD: supportpilot

      - name: Run tenant-isolation integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          TENANT_TEST_DATABASE_URL: postgresql://supportpilot:supportpilot@127.0.0.1:5432/supportpilot_tenant_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-github-actions-jwt-access-secret-min-32-chars
          JWT_REFRESH_SECRET: test-github-actions-jwt-refresh-secret-min-32-chars

      - name: Run Build
        run: npm run build

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Build Docker Image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: supportpilot-ai:${{ github.sha }}

      - name: Build migration image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: false
          tags: supportpilot-ai-migrator:${{ github.sha }}
