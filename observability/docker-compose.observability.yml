# Required environment variables (set in shell or .env before running):
#   METRICS_TOKEN     - bearer token for the /metrics endpoint (must match API)
#   GF_ADMIN_PASSWORD - Grafana admin password
#
# Usage:
#   METRICS_TOKEN=<token> GF_ADMIN_PASSWORD=<password> #     docker compose -f docker-compose.observability.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: supportpilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - sh
      - -c
      - |
        apk add --no-cache gettext 2>/dev/null || true
        if [ -n "${METRICS_TOKEN:-}" ]; then
          envsubst < /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml
        else
          cp /etc/prometheus/prometheus.yml /tmp/prometheus.yml
        fi
        /bin/prometheus           --config.file=/tmp/prometheus.yml           --storage.tsdb.path=/prometheus           --web.console.libraries=/usr/share/prometheus/console_libraries           --web.console.templates=/usr/share/prometheus/consoles

  grafana:
    image: grafana/grafana:10.4.0
    container_name: supportpilot-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/supportpilot.json
    volumes:
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/supportpilot.json:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
