# Local development config — no auth required (METRICS_TOKEN not set in dev).
# Production: docker-compose.observability.yml renders prometheus.yml.tmpl via
# envsubst at container startup, injecting METRICS_TOKEN as a Bearer credential.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "supportpilot-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]
