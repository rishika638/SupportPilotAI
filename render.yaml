
services:
  - type: web
    name: supportpilot-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DISABLE_WORKERS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: supportpilot-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: supportpilot-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: supportpilot-redis
          property: port
      - key: REDIS_TLS
        value: "false"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: METRICS_TOKEN
        generateValue: true

  - type: keyvalue
    name: supportpilot-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: supportpilot-postgres
    databaseName: supportpilot
    user: supportpilot
    plan: free
    region: oregon
    ipAllowList: []
